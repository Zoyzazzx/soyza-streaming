###############################################################################
# MediaMTX v1.20.1 Configuration — Soyza Project
###############################################################################

logLevel: info
logDestinations: [stdout]

###############################################################################
# REST API — used by Next.js dashboard to query stream status
###############################################################################
api: yes
apiAddress: :9997

###############################################################################
# RTMP — OBS or other encoders can push here if needed
# OBS Settings: Server = rtmp://localhost:1935/live  |  Stream Key = stream
###############################################################################
rtmp: yes
rtmpAddress: :1935

###############################################################################
# HLS — browser-based playback
# Playback URL: http://localhost:8888/live/stream/index.m3u8
###############################################################################
hls: yes
hlsAddress: :8888
hlsSegmentDuration: 2s
hlsSegmentCount: 7200
hlsAllowOrigins: ["*"]

###############################################################################
# WebRTC — browser broadcasts camera directly (WHIP protocol)
# WHIP endpoint: http://localhost:8889/live/stream/whip
###############################################################################
webrtc: yes
webrtcAddress: :8889

###############################################################################
# Disable unused protocols
###############################################################################
rtsp: no
srt: no

###############################################################################
# Stream paths
###############################################################################
paths:
  "live/stream":
    # Recordings — saves fmp4 files every 30 seconds
    record: yes
    recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S
    recordFormat: fmp4
    recordSegmentDuration: 30s
